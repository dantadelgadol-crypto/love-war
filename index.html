
<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Important Question</title>

    <style>

        body{
            background:#ffe4ec;
            font-family:Arial 'Poppins', sans-serif;
            text-align:center;
            padding-top:120px;
        }

        h1{
            color:#ff4d88;
        }

        button{
            background:white;
            border:none;
            padding:20px 30px;
            margin:15px;
            border-radius:20px;
            font-size:18px;
            cursor:pointer;
	 
	transition:0.3s;
        }

button:hover{
    transform:scale(1.05);

    background:#ff78ad;
    color:white;
}
        #mensaje{
            margin-top:40px;
            font-size:24px;
            color:#ff4d88;
            font-weight:bold;
        }

    </style>
</head>

<body>

<h1> Who loves more? </h1>

<button id="runaway">
A) You (impossible)
</button>

<button onclick="respuesta()">
B) Me (obviously)
</button>

<div id="mensaje"></div>

<script>

const boton = document.getElementById("runaway");

boton.addEventListener("mouseover", () => {

    boton.style.position = "absolute";

    boton.style.left =
        Math.random() * 800 + "px";

    boton.style.top =
        Math.random() * 500 + "px";

});

function respuesta(){
    document.getElementById("mensaje").innerHTML =
    "I told you that was impossible.<br><br>I do love you more &lt;33";
}

</script>

</body>
</html>
